name: AutoBotz Motors CI - Pipeline de Testes e Regressão

on:
  push:
    branches:
      - 'feature/d11-ci-regression'
      - 'main'
      - 'master'
  pull_request:
    branches:
      - 'feature/d11-ci-regression'
      - 'main'
      - 'master'

jobs:
  build-and-test:
    name: Build & Testes Automatizados (D11 + D15 + Core)
    runs-on: ubuntu-latest

    # Service Container: Sobe o servidor MariaDB no runner do GitHub
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: autobotz_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Java (JDK 26)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Inicializar Banco de Dados de Teste (schema.sql)
        run: |
          echo "Aguardando MariaDB inicializar e criando estrutura..."
          mysql -h 127.0.0.1 -P 3306 -u root -proot autobotz_db_test < schema.sql
          echo "Schema mestre aplicado com sucesso na base autobotz_db_test!"

      - name: Executar Regressão e Testes do D11 (test.sh)
        env:
          AUTOBOTZ_DB_URL: "jdbc:mariadb://127.0.0.1:3306/autobotz_db_test"
          AUTOBOTZ_DB_USER: "root"
          AUTOBOTZ_DB_PASSWORD: "root"
        run: |
          chmod +x scripts/test.sh
          bash scripts/test.sh

      - name: Executar Suítes de Testes do D15 (PR #24 - Mauro)
        if: always()
        env:
          AUTOBOTZ_TEST_DB_URL: "jdbc:mariadb://127.0.0.1:3306/autobotz_db_test"
          AUTOBOTZ_TEST_DB_USER: "root"
          AUTOBOTZ_TEST_DB_PASSWORD: "root"
        run: |
          echo "=================================================="
          echo "Verificando e Executando Suítes de Teste do D15"
          echo "=================================================="

          if [ -d "src/autobotz/portal" ] && [ -f "tests/D15PersistenciaTest.java" ]; then
            # 1. Aplicar Migration 015 se existir e limpar tabela de treinamento
            if [ -f "sql/migration_015.sql" ]; then
              mysql -h 127.0.0.1 -P 3306 -u root -proot autobotz_db_test < sql/migration_015.sql || true
            fi
            mysql -h 127.0.0.1 -P 3306 -u root -proot autobotz_db_test -e "DELETE FROM treinamento_eventos;" 2>/dev/null || true

            # 2. Compilação dos ficheiros do D15
            mkdir -p out
            javac -Xlint:all -cp "lib/*" -sourcepath src -d out \
              src/autobotz/portal/*.java \
              tests/D15*.java

            # 3. Execução das suítes sem banco (Modo Headless / Puro)
            java -cp "out:lib/*" D15PortalTest
            java -cp "out:lib/*" D15ConteudoTest
            java -cp "out:lib/*" D15AtalhoTest

            # 4. Execução do teste com banco (D15PersistenciaTest)
            set +e
            java -cp "out:lib/*" D15PersistenciaTest
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -ne 0 ]; then
              echo "FALHA NO D15PersistenciaTest: Código de saída $EXIT_CODE"
              if [ $EXIT_CODE -eq 2 ]; then
                echo "ERRO GRAVE: O teste foi PULADO (exit code 2) por ausência das variáveis de banco!"
              elif [ $EXIT_CODE -eq 3 ]; then
                echo "ERRO GRAVE: O nome do banco foi RECUSADO (exit code 3) por não terminar com _test!"
              fi
              exit $EXIT_CODE
            fi

            echo "D15PersistenciaTest executado e APROVADO com sucesso (Exit code 0)!"
          else
            echo "AVISO: Ficheiros do D15 (PR #24) ainda não estão presentes nesta branch. Etapa ignorada com segurança."
          fi
