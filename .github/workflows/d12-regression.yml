name: D12 regression

on:
  push:
    branches: [codex/fix-d12-integration]
  pull_request:
    branches: [feature/d12-subscriptions]
    paths:
      - 'src/autobotz/model/AssinaturaCliente.java'
      - 'src/autobotz/model/ResultadoSimulacao.java'
      - 'src/autobotz/service/AssinaturaService.java'
      - 'src/autobotz/dao/AssinaturaDAO.java'
      - 'tests/AssinaturaServiceTest.java'
      - '.github/workflows/d12-regression.yml'

jobs:
  d12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile project and D12 regression
        run: |
          mkdir -p "$RUNNER_TEMP/autobotz-d12-classes"
          find src -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -d "$RUNNER_TEMP/autobotz-d12-classes"
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/autobotz-d12-classes" -d "$RUNNER_TEMP/autobotz-d12-classes" tests/AssinaturaServiceTest.java
      - name: Run deterministic D12 calculations
        run: java -cp "$RUNNER_TEMP/autobotz-d12-classes" AssinaturaServiceTest
