name: D12 regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/autobotz/model/AssinaturaCliente.java'
      - 'src/autobotz/model/ResultadoSimulacao.java'
      - 'src/autobotz/service/AssinaturaService.java'
      - 'src/autobotz/dao/AssinaturaDAO.java'
      - 'src/autobotz/util/ConexaoBanco.java'
      - 'tests/AssinaturaServiceTest.java'
      - 'tests/AssinaturaDAOJdbcTest.java'
      - '.github/workflows/d12-regression.yml'

jobs:
  d12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile project and D12 regression
        run: |
          mkdir -p "$RUNNER_TEMP/autobotz-d12-classes"
          find src -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -d "$RUNNER_TEMP/autobotz-d12-classes"
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/autobotz-d12-classes" -d "$RUNNER_TEMP/autobotz-d12-classes" tests/AssinaturaServiceTest.java
      - name: Run deterministic D12 calculations
        run: java -cp "$RUNNER_TEMP/autobotz-d12-classes" AssinaturaServiceTest

  d12-jdbc:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: d12_test_password
          MARIADB_DATABASE: autobotz_d12_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare disposable D12 schema
        env:
          MYSQL_PWD: d12_test_password
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mariadb-java-client.jar" https://repo1.maven.org/maven2/org/mariadb/jdbc/mariadb-java-client/3.5.10/mariadb-java-client-3.5.10.jar
          # O schema nao seleciona banco; a conexao escolhe o banco isolado.
          mysql -h 127.0.0.1 -P 3306 -u root autobotz_d12_test < schema.sql
      - name: Run D12 JDBC regression
        env:
          AUTOBOTZ_DB_URL: jdbc:mariadb://127.0.0.1:3306/autobotz_d12_test
          AUTOBOTZ_DB_USER: root
          AUTOBOTZ_DB_PASSWORD: d12_test_password
        run: |
          mkdir -p "$RUNNER_TEMP/autobotz-d12-jdbc-classes"
          find src -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -cp "$RUNNER_TEMP/mariadb-java-client.jar" -d "$RUNNER_TEMP/autobotz-d12-jdbc-classes"
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/autobotz-d12-jdbc-classes:$RUNNER_TEMP/mariadb-java-client.jar" -d "$RUNNER_TEMP/autobotz-d12-jdbc-classes" tests/AssinaturaDAOJdbcTest.java
          java -cp "$RUNNER_TEMP/autobotz-d12-jdbc-classes:src:$RUNNER_TEMP/mariadb-java-client.jar" AssinaturaDAOJdbcTest
