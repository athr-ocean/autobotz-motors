name: Integrated ERP Regression

on:
  push:
    branches:
      - codex/integration-validation-20261028
  pull_request:
    branches:
      - main
      - master

jobs:
  integrated-regression:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Validate launchers and bundled JDBC driver
        run: |
          bash -n scripts/*.sh
          bash scripts/run.sh build

      - name: Validate training portal web interface
        run: |
          node --check portal-treinamento/public/app.js
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('portal-treinamento/public/index.html', 'utf8');
          const js = fs.readFileSync('portal-treinamento/public/app.js', 'utf8');
          const cat = JSON.parse(fs.readFileSync('portal-treinamento/content/catalogo.json', 'utf8'));
          for (const id of ['login-form','mfa-form','dashboard','metricas-form','metricas-linhas','sair']) {
            if (!html.includes('id="' + id + '"')) throw Error('Missing portal UI ' + id);
          }
          for (const url of ['/api/login','/api/login/mfa','/api/logout','/metricas']) {
            if (!js.includes(url)) throw Error('Missing portal endpoint ' + url);
          }
          if (!cat.materiais.some(x => x.slug === 'roteiro-tutorial-3-min' && x.tipo === 'ROTEIRO'))
            throw Error('Missing 3-minute tutorial script');
          console.log('Portal HTML/JS/catalog OK');
          NODE

      - name: Initialize disposable databases and migrations
        shell: bash
        run: |
          set -euo pipefail
          for db in autobotz_d11_test autobotz_d12_test autobotz_d13_test autobotz_d14_test autobotz_d15_test; do
            [[ "$db" == *_test ]]
            mysql -h 127.0.0.1 -uroot -ptest-only -e "CREATE DATABASE \`$db\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
            mysql -h 127.0.0.1 -uroot -ptest-only "$db" < schema.sql
            for migration in db/migrations/0{11,12,13,14,15,16}_*.sql; do
              mysql -h 127.0.0.1 -uroot -ptest-only "$db" < "$migration"
            done
          done

      - name: Compile application and all test sources
        run: |
          mkdir -p "$RUNNER_TEMP/autobotz-classes" "$RUNNER_TEMP/autobotz-tests"
          find src -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -Xlint:all -cp 'lib/*' -d "$RUNNER_TEMP/autobotz-classes"
          find tests -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -Xlint:all -cp "$RUNNER_TEMP/autobotz-classes:src:lib/*" -d "$RUNNER_TEMP/autobotz-tests"

      - name: Run deterministic service and portal suites
        run: |
          cp="$RUNNER_TEMP/autobotz-classes:$RUNNER_TEMP/autobotz-tests:src:lib/*"
          AUTOBOTZ_DB_URL=jdbc:autobotz-test:isolated AUTOBOTZ_DB_PASSWORD=dummy java -cp "$cp" ConexaoBancoDataSourceTest
          for test in AssinaturaServiceTest D12SimuladorUITest D13BlockchainApiTest D13LedgerIntegrityTest D14SegurancaTest D14SessaoWebTest D15PortalTest D15ConteudoTest D15AtalhoTest; do
            java -cp "$cp" "$test"
          done

      - name: Run D11 and D12 JDBC suites
        env:
          AUTOBOTZ_DB_USER: root
          AUTOBOTZ_DB_PASSWORD: test-only
        run: |
          cp="$RUNNER_TEMP/autobotz-classes:$RUNNER_TEMP/autobotz-tests:src:lib/*"
          AUTOBOTZ_DB_URL=jdbc:mariadb://127.0.0.1:3306/autobotz_d11_test?sslMode=disable java -cp "$cp" D11ComprasTest
          AUTOBOTZ_DB_URL=jdbc:mariadb://127.0.0.1:3306/autobotz_d11_test?sslMode=disable java -Djava.awt.headless=true -cp "$cp" autobotz.ui.swing.D11ComprasSwingTest
          AUTOBOTZ_DB_URL=jdbc:mariadb://127.0.0.1:3306/autobotz_d12_test?sslMode=disable java -cp "$cp" AssinaturaDAOJdbcTest

      - name: Run D13 and D14 JDBC suites
        env:
          AUTOBOTZ_DB_USER: root
          AUTOBOTZ_DB_PASSWORD: test-only
        run: |
          cp="$RUNNER_TEMP/autobotz-classes:$RUNNER_TEMP/autobotz-tests:src:lib/*"
          AUTOBOTZ_DB_URL=jdbc:mariadb://127.0.0.1:3306/autobotz_d13_test?sslMode=disable java -cp "$cp" D13JdbcIntegrationTest
          AUTOBOTZ_DB_URL=jdbc:mariadb://127.0.0.1:3306/autobotz_d14_test?sslMode=disable java -cp "$cp" D14JdbcIntegrationTest

      - name: Run D15 persistence and authenticated HTTP flow
        env:
          AUTOBOTZ_TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/autobotz_d15_test?sslMode=disable
          AUTOBOTZ_TEST_DB_USER: root
          AUTOBOTZ_TEST_DB_PASSWORD: test-only
          AUTOBOTZ_DB_URL: jdbc:mariadb://127.0.0.1:3306/autobotz_d15_test?sslMode=disable
          AUTOBOTZ_DB_USER: root
          AUTOBOTZ_DB_PASSWORD: test-only
        run: |
          cp="$RUNNER_TEMP/autobotz-classes:$RUNNER_TEMP/autobotz-tests:src:lib/*"
          java -cp "$cp" D15PersistenciaTest
          java -cp "$cp" D15AuthHttpJdbcTest
